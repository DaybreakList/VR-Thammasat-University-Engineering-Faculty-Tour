<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360/180 API Stream Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .controls { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .control-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: #bbb; }
        input[type="range"], select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
        .img-container { background: #000; border-radius: 12px; overflow: hidden; min-height: 450px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        img { max-width: 100%; height: auto; display: block; }
        .val-badge { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>360 / 180 Camera API Demo Viewer</h2>
        
        <div class="controls">
            <div class="control-group">
                <label>โหมดการแสดงผล (Mode):</label>
                <select id="modeSelect">
                    <option value="360">360° Perspective (ตัดเฉพาะมุมมองสายตา)</option>
                    <option value="180">180° Panoramic Crop (ตัดพาโนรามาครึ่งวงกลม)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Field of View (FOV): <span id="fovVal" class="val-badge">90°</span></label>
                <input type="range" id="fov" min="30" max="120" value="90">
            </div>

            <div class="control-group">
                <label>Yaw (หันซ้าย - ขวา): <span id="yawVal" class="val-badge">0°</span></label>
                <input type="range" id="yaw" min="-180" max="180" value="0">
            </div>

            <div class="control-group">
                <label>Pitch (ก้ม - เงย): <span id="pitchVal" class="val-badge">0°</span></label>
                <input type="range" id="pitch" min="-90" max="90" value="0">
            </div>
        </div>

        <div class="img-container">
            <img id="viewer" src="/api/v1/frame" alt="Stream Frame">
        </div>
    </div>

    <script>
        const yawInput = document.getElementById('yaw');
        const pitchInput = document.getElementById('pitch');
        const fovInput = document.getElementById('fov');
        const modeSelect = document.getElementById('modeSelect');
        const viewer = document.getElementById('viewer');

        // แทนที่ฟังก์ชันนี้เพื่อเปลี่ยนจากภาพนิ่งเป็น Live Stream
        function updateFrame() {
            const yaw = yawInput.value;
            const pitch = pitchInput.value;
            const fov = fovInput.value;
            const mode = modeSelect.value;

            document.getElementById('yawVal').innerText = yaw + '°';
            document.getElementById('pitchVal').innerText = pitch + '°';
            document.getElementById('fovVal').innerText = fov + '°';

            // จุดสำคัญ: เปลี่ยนปลายทางเป็น /api/v1/stream และเอา &t=${Date.now()} ออก
            viewer.src = `/api/v1/stream?yaw=${yaw}&pitch=${pitch}&fov=${fov}&mode=${mode}`;
        }

        yawInput.addEventListener('input', updateFrame);
        pitchInput.addEventListener('input', updateFrame);
        fovInput.addEventListener('input', updateFrame);
        modeSelect.addEventListener('change', updateFrame);

        // สั่งให้โหลดภาพครั้งแรกทันทีที่เปิดหน้าเว็บ
        updateFrame();
    </script>
</body>
</html>
